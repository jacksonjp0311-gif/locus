name: Locus

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refresh
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cycle
        run: PYTHONPATH=. python3 -m colony.tools.locus
      - name: Commit
        run: |
          git config user.name "James Jackson"
          git config user.email "jacksonjp0311-gif@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "locus $(date -u +%Y-%m-%dT%H%MZ)"
          git pull --rebase origin main || true
          git push
